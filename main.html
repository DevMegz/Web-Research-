<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Research Final Assessment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #eaf1f8, #cbd8e6);
    }

    .card {
      width: min(90%, 560px);
      padding: 48px 40px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.14);
    }

    .logo {
      display: block;
      width: 180px;
      height: auto;
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.3;
      color: #17365d;
    }

    p {
      margin: 0 0 32px;
      font-size: 18px;
      color: #526174;
    }

    button {
      padding: 20px 42px;
      border: none;
      border-radius: 10px;
      background: #1769aa;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(23, 105, 170, 0.25);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: #10558d;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #8ec5f0;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://images.crunchbase.com/image/upload/c_pad,h_256,w_256,f_auto,q_auto:eco,dpr_1/sbnbzlq4zhdngwgzzzdm" alt="Merit logo">
    <h1>Web Research Final Assessment</h1>
    <p>Click the button to start the test</p>
    <button id="testButton" type="button">Start Test</button>
  </main>

  <script>
    const testLinks = [
      "https://forms.cloud.microsoft/r/EYgqWpyeUE",
      "https://forms.cloud.microsoft/r/dPXjzmQcZb"
    ];

    document.getElementById("testButton").addEventListener("click", () => {
      const randomLink = testLinks[Math.floor(Math.random() * testLinks.length)];
      window.open(randomLink, "_blank", "noopener,noreferrer");
    });
  </script>
</body>
</html>
